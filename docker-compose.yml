version: '3.1'

services:

  fix-api:
    image: nemdeveloping/fix-api:1.0
    restart: always
    ports:
      - 8081:80
    environment:
      DB_USER: exampleuser
      DB_PASSWORD: examplepass
      DB_NAME: fix
      DB_HOSTNAME: fix-database

  fix-database:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_DATABASE: fix
      MARIADB_USER: exampleuser
      MARIADB_PASSWORD: examplepass
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - db:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8082:8080
volumes:
  fix:
  db:





