version: '3.1'

services:
  traefik:
    image: traefik:v2.10
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - elticketo-network

  elticketo-api:
    build:
      context: .
      dockerfile: ./BackEnd/Dockerfile
    restart: always
    depends_on:
      - fix-database
    networks:
      - elticketo-network
    environment:
      DB_USER: exampleuser
      DB_PASSWORD: examplepass
      DB_NAME: fix
      DB_HOSTNAME: fix-database
    ports:
      - "9001:9001"
    volumes:
      - ./BackEnd:/usr/src/app
    labels:
    - "traefik.enable=true"

    ## Middleware de redirection : /static → /api/static
    - "traefik.http.middlewares.static-redirect.redirectregex.regex=^/static/(.*)"
    - "traefik.http.middlewares.static-redirect.redirectregex.replacement=/api/static/$$1"
    - "traefik.http.middlewares.static-redirect.redirectregex.permanent=true"

    ## Route de redirection static
    - "traefik.http.routers.static-redirect.rule=PathPrefix(`/static`)"
    - "traefik.http.routers.static-redirect.middlewares=static-redirect"
    - "traefik.http.routers.static-redirect.entrypoints=web"
    - "traefik.http.routers.static-redirect.priority=100"

    ## Middleware pour désactiver validator Swagger UI
    - "traefik.http.middlewares.add-validator-url.redirectregex.regex=^/api/docs$"
    - "traefik.http.middlewares.add-validator-url.redirectregex.replacement=/api/docs?validatorUrl="
    - "traefik.http.middlewares.add-validator-url.redirectregex.permanent=false"

    ## Router pour appliquer middleware sur /api/docs
    - "traefik.http.routers.docs-validator-disable.rule=Path(`/api/docs`)"
    - "traefik.http.routers.docs-validator-disable.entrypoints=web"
    - "traefik.http.routers.docs-validator-disable.middlewares=add-validator-url"
    - "traefik.http.routers.docs-validator-disable.service=elticketo-api"

    ## Route principale pour /api
    - "traefik.http.routers.elticketo-api.rule=PathPrefix(`/api`)"
    - "traefik.http.routers.elticketo-api.entrypoints=web"
    - "traefik.http.services.elticketo-api.loadbalancer.server.port=9001"



  elticketo-app:
    build:
      context: .
      dockerfile: ./FrontEnd/Dockerfile
    restart: always
    depends_on:
      - fix-database
      - elticketo-api
    networks:
      - elticketo-network
    volumes:
      - ./FrontEnd:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      API_URL: "http://elticketo-api:9001"
      APP_URL: "http://localhost:8082"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elticketo-app.rule=PathPrefix(`/`)"
      - "traefik.http.services.elticketo-app.loadbalancer.server.port=5173"
    ports:
      - "8082:5173"

  fix-database:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_DATABASE: fix
      MARIADB_USER: exampleuser
      MARIADB_PASSWORD: examplepass
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    networks:
      - elticketo-network
    volumes:
      - db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    environment:
      PMA_HOST: fix-database
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: /phpmyadmin/
    networks:
      - elticketo-network
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.phpmyadmin.rule=PathPrefix(`/phpmyadmin`)"

    - "traefik.http.middlewares.phpmyadmin-stripprefix.stripPrefix.prefixes=/phpmyadmin"
    - "traefik.http.routers.phpmyadmin.middlewares=phpmyadmin-stripprefix"

    - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"

volumes:
  fix:
  db:

networks:
  elticketo-network:
