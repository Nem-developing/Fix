logsBucket: 'gs://prod-nehemiebarkia-fix-builds'

substitutions:
  _TAG_NAME: 'latest'

options:
  logging: GCS_ONLY

steps:
  # Build and push the backend API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fix-api:${_TAG_NAME}'
      - './BackEnd'
    id: 'build-api'

  # Build and push the frontend app image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fix-app:${_TAG_NAME}'
      - './FrontEnd'
    id: 'build-app'

images:
  - 'gcr.io/$PROJECT_ID/fix-api:${_TAG_NAME}'
  - 'gcr.io/$PROJECT_ID/fix-app:${_TAG_NAME}'
