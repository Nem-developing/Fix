logsBucket: 'gs://prod-nehemiebarkia-fix-builds'

options:
  logging: GCS_ONLY

steps:
  # Install Ansible
  - name: 'python:3.9-slim'
    entrypoint: 'pip'
    args: ['install', 'ansible']

  # Run Ansible playbook
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'ansible-playbook'
    args: ['-i', 'ansible/inventory.yml', 'ansible/playbook.yml']
